name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC Debug
            os: ubuntu-24.04
            config: Debug
            options: -DCMAKE_CXX_COMPILER=g++
          - name: Linux Clang Debug (ASan and UBSan)
            os: ubuntu-24.04
            config: Debug
            fuzz: true
            options: -DCMAKE_CXX_COMPILER=clang++ -DBITGRID_ENABLE_SANITIZERS=ON -DBITGRID_ENABLE_FUZZING=ON
          - name: macOS AppleClang Release
            os: macos-15
            config: Release
            options: -DCMAKE_CXX_COMPILER=clang++
          - name: Windows MSVC Release
            os: windows-2022
            config: Release
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure CMake
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          ${{ matrix.options }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Run independent recovery experiment
        if: runner.os == 'Linux'
        run: |
          python3 tools/recovery_experiment.py build/bitgrid --demo-svg build/recovery-demo.svg
          cmp docs/recovery-demo.svg build/recovery-demo.svg

      - name: Smoke test grid parser fuzz targets
        if: matrix.fuzz
        run: |
          mkdir -p build/fuzz-corpus/habg build/fuzz-corpus/bgr1
          build/bitgrid_fuzz_decode -runs=1000 build/fuzz-corpus/habg tests/fuzz/corpus/habg
          build/bitgrid_fuzz_recover -runs=1000 build/fuzz-corpus/bgr1 tests/fuzz/corpus/bgr1
